name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez. Um push novo cancela o que ainda estiver rodando ou na
# fila, em vez de entrar atrás dele: com `cancel-in-progress: false`, um run
# travado segurava o grupo e todos os seguintes ficavam "pending" sem prazo.
# O que vale é sempre o último commit da main, então cancelar é o certo aqui.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Um job que não consegue runner falha rápido em vez de ficar pendurado.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Requer Pages já ligado no repositório com Source: GitHub Actions
      # (Settings → Pages). O GITHUB_TOKEN do workflow não consegue ligar
      # sozinho: criar o site do Pages é uma operação de admin, e o
      # `enablement: true` falha com "Resource not accessible by integration".
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
